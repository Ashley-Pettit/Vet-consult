name: Android app

# Builds the Care Scribe Android app for Bunurong Wildlife Care and attaches the APK to the
# "Care Scribe for Android" release, so there's always one link to the latest build.
on:
  push:
    branches: [bunurong-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build the web app
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Care-Scribe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Care-Scribe-apk
          path: Care-Scribe.apk

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Care-Scribe.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Care Scribe for Android (build ${{ github.run_number }})" \
            --notes "Care Scribe for Bunurong Wildlife Care. On the phone, tap Care-Scribe.apk below to download, open it, and allow the install when Android asks."

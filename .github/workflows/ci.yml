name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Animal Welfare Companion (Bunurong Wildlife Care) is published twice:
      #   /care/       live, from the care-prod branch
      #   /care-beta/  beta, from the bunurong-wildlife branch (where new changes land first)
      # Promote beta to live by moving care-prod up to bunurong-wildlife, then re-running this workflow.
      - name: Build Animal Welfare Companion into /care/ and /care-beta/
        if: github.ref == 'refs/heads/main'
        run: |
          build_care() {
            git fetch --depth 1 origin "$1"
            git worktree add "../$2" FETCH_HEAD
            (cd "../$2" && npm ci && npm run test:unit && CHANNEL="$3" npm run build)
            cp -r "../$2/dist" "$GITHUB_WORKSPACE/dist/$2"
          }
          build_care care-prod care live
          build_care bunurong-wildlife care-beta beta
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
